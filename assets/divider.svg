<?xml version="1.0" encoding="UTF-8"?>
<svg width="1000" height="10" viewBox="0 0 1000 10" xmlns="http://www.w3.org/2000/svg" role="presentation">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f472b6" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#c084fc"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .pulse { animation: move 4s ease-in-out infinite; }
    @keyframes move { 0% {transform: translateX(-300px)} 100% {transform: translateX(1000px)} }
  </style>
  <rect x="0" y="4" width="1000" height="1" fill="#2a2735"/>
  <rect class="pulse" x="0" y="3" width="300" height="3" rx="1.5" fill="url(#g)"/>
</svg>
